<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Neev - hyper-local red brick supply marketplace demo" />
  <title>Neev | Build local, build with certainty</title>
  <style>
    :root {
      --bg: #f5f5f2;
      --panel: #ffffff;
      --panel-soft: #fbfbf9;
      --ink: #1c211f;
      --muted: #747b76;
      --muted-2: #9aa19c;
      --line: #e6e8e4;
      --sidebar: #202522;
      --sidebar-2: #29302c;
      --sidebar-ink: #f5f7f3;
      --blue: #2f6df6;
      --blue-2: #eaf0ff;
      --green: #2e8b67;
      --green-2: #e8f5ef;
      --amber: #b7791f;
      --amber-2: #fff5df;
      --red: #c4544c;
      --red-2: #fff0ee;
      --violet: #7256b5;
      --shadow: 0 12px 34px rgba(32, 37, 34, .06);
      --glass: rgba(255, 255, 255, .62);
      --glass-line: rgba(255, 255, 255, .74);
      --radius-sm: 12px;
      --radius: 16px;
      --radius-lg: 22px;
    }

    [data-theme="dark"] {
      --bg: #151917;
      --panel: #202522;
      --panel-soft: #1b211e;
      --ink: #f0f3ef;
      --muted: #a0aaa3;
      --muted-2: #748078;
      --line: #343c37;
      --sidebar: #101412;
      --sidebar-2: #1e2822;
      --sidebar-ink: #f4f7f3;
      --blue-2: #202e51;
      --green-2: #17372b;
      --amber-2: #3c2f17;
      --red-2: #412321;
      --shadow: 0 18px 44px rgba(0, 0, 0, .18);
      --glass: rgba(32, 37, 34, .68);
      --glass-line: rgba(255, 255, 255, .12);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, ui-sans-serif, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background .18s ease, color .18s ease;
    }
    button, input, select, textarea { font: inherit; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(47, 109, 246, .28);
      outline-offset: 2px;
    }
    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; overflow-y: auto;
      display: flex; flex-direction: column; padding: 24px 14px 16px;
      background: linear-gradient(180deg, color-mix(in srgb, var(--sidebar) 94%, #526058 6%), var(--sidebar));
      border-right: 1px solid rgba(255,255,255,.08); color: var(--sidebar-ink);
      isolation: isolate;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 10px 24px; text-decoration: none; }
    .brand-logo { width: 112px; height: 52px; display: block; overflow: hidden; border-radius: 12px; background: #f4f1e9; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
    .brand-logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .brand-mark {
      width: 32px; height: 32px; border-radius: 11px; display: grid; place-items: center;
      color: #fff; background: linear-gradient(145deg, #e07d4a, #a44937);
      font-weight: 800; letter-spacing: -.08em; box-shadow: 0 5px 16px rgba(164, 73, 55, .28);
    }
    .brand-name { font-size: 19px; font-weight: 760; letter-spacing: -.04em; }
    .brand-sub { color: #9ca69f; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; margin-top: 1px; }
    .pilot-badge {
      display: inline-flex; align-items: center; gap: 6px; margin: 0 9px 20px; padding: 7px 9px;
      border: 1px solid rgba(255,255,255,.12); border-radius: 9px; background: rgba(255,255,255,.06);
      color: #cbd5cd; font-size: 11px; font-weight: 650;
    }
    .pilot-dot { width: 6px; height: 6px; border-radius: 50%; background: #6dd19d; box-shadow: 0 0 0 3px rgba(109, 209, 157, .12); }
    .nav-label { margin: 4px 10px 8px; color: #7f8b82; font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 3px; }
    .nav button {
      width: 100%; display: flex; align-items: center; gap: 11px; padding: 10px 11px; border: 0; border-radius: 12px;
      background: transparent; color: #aeb8b0; text-align: left; transition: .18s ease;
    }
    .nav button:hover { background: rgba(255,255,255,.06); color: #f4f7f4; }
    .nav button.active { background: color-mix(in srgb, var(--sidebar-2) 84%, transparent); color: #fff; box-shadow: inset 3px 0 0 #7da1ff, 0 6px 18px rgba(0,0,0,.08); }
    .nav svg { width: 17px; height: 17px; flex: 0 0 auto; opacity: .86; }
    .nav .count { margin-left: auto; min-width: 20px; padding: 2px 6px; border-radius: 10px; background: rgba(255,255,255,.1); color: #dbe2dc; font-size: 11px; text-align: center; }
    .sidebar-foot { margin-top: auto; padding: 18px 9px 0; border-top: 1px solid rgba(255,255,255,.08); }
    .pilot-note { color: #94a097; font-size: 11px; line-height: 1.5; }
    .pilot-note strong { display: block; color: #dfe7df; margin-bottom: 3px; }
    .main { min-width: 0; background: radial-gradient(circle at 92% -8%, rgba(47,109,246,.06), transparent 26%), var(--bg); }
    .topbar {
      height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 0 36px; border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); background: color-mix(in srgb, var(--bg) 72%, transparent);
      -webkit-backdrop-filter: blur(22px) saturate(135%); backdrop-filter: blur(22px) saturate(135%); position: sticky; top: 0; z-index: 10;
    }
    .crumb { display: flex; align-items: center; gap: 8px; min-width: 170px; color: var(--muted); font-size: 13px; }
    .crumb strong { color: var(--ink); font-weight: 650; }
    .crumb svg { width: 14px; height: 14px; flex: 0 0 auto; }
    .top-actions { display: flex; align-items: center; gap: 9px; }
    .search {
      width: min(280px, 28vw); display: flex; align-items: center; gap: 8px; padding: 9px 12px;
      border: 1px solid var(--glass-line); border-radius: 12px; background: var(--glass); color: var(--muted);
      -webkit-backdrop-filter: blur(16px) saturate(135%); backdrop-filter: blur(16px) saturate(135%); box-shadow: 0 2px 8px rgba(32,37,34,.04);
    }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; }
    .search svg { width: 16px; height: 16px; flex: 0 0 auto; }
    .icon-button, .avatar {
      width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line);
      border-radius: 12px; background: var(--glass); color: var(--muted); position: relative;
      -webkit-backdrop-filter: blur(16px) saturate(135%); backdrop-filter: blur(16px) saturate(135%);
    }
    .icon-button:hover { color: var(--ink); border-color: var(--muted-2); }
    .icon-button svg { width: 17px; height: 17px; }
    .notification-dot { position: absolute; top: 7px; right: 7px; width: 5px; height: 5px; border-radius: 50%; background: var(--red); }
    .avatar { border: 0; border-radius: 50%; background: #e6c2a7; color: #673c26; font-size: 12px; font-weight: 800; }
    .page { width: min(1440px, 100%); margin: 0 auto; padding: 32px 36px 56px; }
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { color: var(--blue); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1, h2, h3, p { margin: 0; }
    h1 { margin-top: 5px; font-size: clamp(27px, 3vw, 38px); line-height: 1.05; letter-spacing: -.052em; font-weight: 700; }
    h2 { font-size: 20px; line-height: 1.15; letter-spacing: -.035em; font-weight: 700; }
    h3 { font-size: 14px; line-height: 1.2; font-weight: 700; }
    .subhead { max-width: 620px; margin-top: 9px; color: var(--muted); font-size: 14px; }
    .header-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .btn {
      min-height: 40px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--ink); font-weight: 680;
      transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--muted-2); box-shadow: 0 5px 15px rgba(32,37,34,.07); }
    .btn.primary { border-color: var(--blue); background: var(--blue); color: #fff; }
    .btn.primary:hover { border-color: #2158d6; background: #2158d6; }
    .btn.subtle { border-color: transparent; background: var(--blue-2); color: var(--blue); }
    .btn.danger { border-color: transparent; background: var(--red-2); color: var(--red); }
    .btn.small { min-height: 34px; padding: 0 11px; border-radius: 9px; font-size: 12px; }
    .btn svg { width: 15px; height: 15px; }
    .demo-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; border-radius: 8px; background: var(--amber-2); color: var(--amber); font-size: 11px; font-weight: 800; letter-spacing: .05em; }
    .demo-badge svg { width: 13px; height: 13px; }
    .grid { display: grid; gap: 16px; }
    .grid.stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 18px; }
    .grid.two { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .9fr); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .card { border: 1px solid var(--line); border-radius: 18px; background: var(--panel); box-shadow: var(--shadow); transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease; }
    .card:hover { border-color: color-mix(in srgb, var(--line) 70%, var(--blue) 30%); }
    .card.pad { padding: 20px; }
    .stat-card { min-height: 132px; padding: 17px 18px; }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
    .stat-icon { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; background: var(--blue-2); color: var(--blue); }
    .stat-icon.green { background: var(--green-2); color: var(--green); }
    .stat-icon.amber { background: var(--amber-2); color: var(--amber); }
    .stat-icon.violet { background: #f0ebff; color: var(--violet); }
    [data-theme="dark"] .stat-icon.violet { background: #2c2444; }
    .stat-icon svg { width: 16px; height: 16px; }
    .stat-value { margin-top: 18px; font-size: 26px; line-height: 1; letter-spacing: -.045em; font-weight: 760; }
    .stat-foot { margin-top: 9px; color: var(--muted); font-size: 11px; }
    .trend { color: var(--green); font-weight: 700; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    .section-head .muted { color: var(--muted); font-size: 12px; }
    .need-card { overflow: hidden; }
    .need-card-main { padding: 20px; }
    .need-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .need-title { margin-top: 5px; font-size: 18px; font-weight: 750; letter-spacing: -.035em; }
    .need-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 11px; color: var(--muted); font-size: 12px; }
    .need-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .need-meta svg { width: 14px; height: 14px; color: var(--muted-2); }
    .stepper { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin: 21px 0 10px; }
    .step { position: relative; height: 5px; border-radius: 10px; background: var(--line); overflow: hidden; }
    .step.done, .step.current { background: var(--blue); }
    .step.current { background: linear-gradient(90deg, var(--blue) 57%, var(--line) 57%); }
    .step-labels { display: flex; justify-content: space-between; color: var(--muted-2); font-size: 10px; }
    .step-labels .active { color: var(--blue); font-weight: 750; }
    .need-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 19px; padding-top: 15px; border-top: 1px solid var(--line); }
    .offer-count { color: var(--muted); font-size: 12px; }
    .offer-count strong { color: var(--ink); }
    .side-stack { display: grid; gap: 16px; }
    .estimator { padding: 20px; background: linear-gradient(155deg, var(--panel), var(--panel-soft)); }
    .estimator-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .estimator-body { margin-top: 18px; }
    .field-label { display: flex; justify-content: space-between; margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .field-label strong { color: var(--ink); }
    .range { width: 100%; accent-color: var(--blue); }
    .estimate-result { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--line); }
    .estimate-number { font-size: 24px; letter-spacing: -.045em; font-weight: 780; }
    .estimate-caption { color: var(--muted); font-size: 11px; }
    .confidence { display: inline-flex; align-items: center; gap: 5px; color: var(--green); font-size: 11px; font-weight: 750; }
    .confidence-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .trust-card { padding: 18px 20px; }
    .trust-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .trust-row:last-child { padding-bottom: 0; border-bottom: 0; }
    .trust-row:first-of-type { padding-top: 14px; }
    .trust-mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--green-2); color: var(--green); }
    .trust-mark svg { width: 15px; height: 15px; }
    .trust-copy { min-width: 0; flex: 1; }
    .trust-copy strong { display: block; font-size: 12px; }
    .trust-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .trust-value { font-weight: 780; font-size: 13px; }
    .activity { margin-top: 18px; }
    .activity-list { display: grid; gap: 0; }
    .activity-item { display: flex; gap: 11px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .activity-item:last-child { border-bottom: 0; padding-bottom: 0; }
    .activity-icon { width: 29px; height: 29px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 9px; background: var(--blue-2); color: var(--blue); }
    .activity-icon.green { background: var(--green-2); color: var(--green); }
    .activity-icon.amber { background: var(--amber-2); color: var(--amber); }
    .activity-icon svg { width: 14px; height: 14px; }
    .activity-copy { min-width: 0; flex: 1; }
    .activity-copy strong { display: block; font-size: 12px; }
    .activity-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }
    .activity-time { color: var(--muted-2); font-size: 10px; white-space: nowrap; }
    .empty { padding: 38px 20px; color: var(--muted); text-align: center; }
    .empty strong { display: block; color: var(--ink); margin-bottom: 5px; }
    .hidden { display: none !important; }

    @media (max-width: 1080px) {
      .grid.stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid.two { grid-template-columns: 1fr; }
      .search { width: 210px; }
    }
    @media (max-width: 760px) {
      .app-shell { display: block; }
      .sidebar { position: fixed; z-index: 30; width: 260px; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 20px 0 50px rgba(0,0,0,.18); }
      .sidebar.open { transform: translateX(0); }
      .mobile-overlay:not(.hidden) { display: block !important; position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.36); }
      .topbar { height: 64px; padding: 0 16px; }
      .crumb { min-width: auto; }
      .crumb span { display: none; }
      .search { display: none; }
      .page { padding: 25px 16px 44px; }
      .page-header { display: block; }
      .header-actions { margin-top: 17px; }
      .grid.stats { gap: 10px; }
      .stat-card { min-height: 119px; padding: 14px; }
      .stat-value { margin-top: 14px; font-size: 22px; }
      .grid.three { grid-template-columns: 1fr; }
      .need-card-top { display: block; }
      .need-card-top .demo-badge { margin-top: 13px; }
      .need-card-foot { align-items: flex-start; flex-direction: column; }
      .top-actions { gap: 6px; }
      .mode-switch { display: none !important; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast-region" aria-live="polite"></div>
  <div id="modal-root"></div>
  <style>
    .mode-switch { display: flex; align-items: center; padding: 3px; border: 1px solid var(--glass-line); border-radius: 12px; background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(135%); backdrop-filter: blur(16px) saturate(135%); box-shadow: 0 2px 8px rgba(32,37,34,.04); }
    .mode-switch button { min-height: 30px; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 750; transition: background .18s ease, color .18s ease, box-shadow .18s ease; }
    .mode-switch button.active { background: var(--ink); color: var(--panel); box-shadow: 0 2px 7px rgba(32,37,34,.16); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .filter-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .input, .select { height: 40px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
    .input::placeholder { color: var(--muted-2); }
    .select { min-width: 130px; }
    .segmented { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(14px) saturate(130%); backdrop-filter: blur(14px) saturate(130%); }
    .segmented button { min-height: 30px; border: 0; padding: 0 10px; border-radius: 9px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; transition: background .18s ease, color .18s ease, box-shadow .18s ease; }
    .segmented button.active { background: var(--panel); color: var(--ink); box-shadow: 0 2px 8px rgba(32,37,34,.08); }
    .status { display: inline-flex; align-items: center; gap: 6px; width: max-content; padding: 5px 8px; border-radius: 7px; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
    .status::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .status.green { color: var(--green); background: var(--green-2); }
    .status.blue { color: var(--blue); background: var(--blue-2); }
    .status.amber { color: var(--amber); background: var(--amber-2); }
    .status.red { color: var(--red); background: var(--red-2); }
    .status.gray { color: var(--muted); background: var(--panel-soft); }
    .offer-list { display: grid; gap: 11px; }
    .offer-card { padding: 17px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); transition: border .18s ease, transform .18s ease, box-shadow .18s ease; }
    .offer-card:hover { transform: translateY(-1px); border-color: #bfc7c0; box-shadow: 0 9px 22px rgba(32,37,34,.06); }
    .offer-card.recommended { border-color: #9ab4ff; box-shadow: 0 0 0 1px rgba(47,109,246,.08), var(--shadow); }
    .offer-main { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
    .vendor-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .vendor-avatar { width: 35px; height: 35px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 11px; color: #fff; font-size: 10px; font-weight: 800; }
    .vendor-name { min-width: 0; font-weight: 760; }
    .vendor-name small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; font-weight: 500; }
    .verified { display: inline-flex; align-items: center; gap: 3px; margin-left: 5px; color: var(--green); font-size: 10px; font-weight: 700; }
    .verified svg { width: 12px; height: 12px; }
    .offer-price { text-align: right; white-space: nowrap; }
    .offer-price strong { display: block; font-size: 20px; letter-spacing: -.04em; }
    .offer-price span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .offer-tags { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin: 13px 0 14px; }
    .mini-tag { display: inline-flex; align-items: center; gap: 5px; padding: 5px 7px; border-radius: 7px; background: var(--panel-soft); color: var(--muted); font-size: 10px; }
    .mini-tag svg { width: 12px; height: 12px; }
    .mini-tag.good { background: var(--green-2); color: var(--green); }
    .mini-tag.warn { background: var(--amber-2); color: var(--amber); }
    .breakdown { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 11px; border-radius: 10px; background: var(--panel-soft); }
    .breakdown-item { min-width: 0; }
    .breakdown-item span { display: block; color: var(--muted); font-size: 10px; }
    .breakdown-item strong { display: block; margin-top: 4px; font-size: 12px; }
    .offer-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; }

    function openCounterModal(offerId) {
      const offer = offerFor(offerId) || db.offers[0]; const quote = offer ? quoteFor(offer.quote) : null;
      openModal(`${modalHead('Versioned commercial term', quote ? `Counter ${offer.vendor}` : 'Create structured offer', 'Every edit creates a new version. Freight stays separate from the unit rate.')}<form id="counter-form"><div class="modal-body"><div class="notice" style="margin-bottom:16px">${icon('shield')}<div><strong>${offer?.vendor || 'Buyer request'}</strong>${offer ? `${number(offer.quantity)} units · current landed total ${rupees(offer.total)}` : 'Respond to the active 25,000-unit buyer request.'}</div></div><div class="form-grid"><div class="form-field"><label for="counter-quantity">Quantity</label><input id="counter-quantity" name="quantity" type="number" value="${offer?.quantity || 25000}" min="5000" step="1000" required /></div><div class="form-field"><label for="counter-price">Unit rate / Rs</label><input id="counter-price" name="price" type="number" value="${offer?.unitPrice || 7.08}" min="0" step="0.01" required /></div><div class="form-field"><label for="counter-freight">Freight / Rs</label><input id="counter-freight" name="freight" type="number" value="${offer?.freight || 5400}" min="0" step="100" required /></div><div class="form-field"><label for="counter-expiry">Offer expires</label><select id="counter-expiry" name="expiry"><option>29 Sep, 18:00</option><option>30 Sep, 12:00</option><option>01 Oct, 09:00</option></select></div><div class="form-field full"><label for="counter-notes">Notes</label><textarea id="counter-notes" name="notes" placeholder="State any delivery or quantity condition">Keep freight as a separate term; dispatch window 02-03 Oct.</textarea></div></div></div><div class="modal-foot"><button type="button" class="btn" data-close-modal>Cancel</button><button type="submit" class="btn primary">Save version ${icon('arrow')}</button></div></form>`);
      document.getElementById('counter-form').addEventListener('submit', event => { event.preventDefault(); const form = new FormData(event.target); const quantity = Number(form.get('quantity')); const price = Number(form.get('price')); const freight = Number(form.get('freight')); const total = quantity * price + freight + (offer?.zone || 2800); if (quote) { const version = quote.versions.length + 1; quote.versions.push({ v: version, by: db.mode === 'vendor' ? 'Shakti Kiln Works' : 'You', time: 'Just now', note: form.get('notes'), price, freight }); quote.quantity = quantity; quote.unitPrice = price; quote.freight = freight; quote.total = total; quote.status = 'COUNTERED'; db.selectedQuote = quote.id; if (offer) { offer.quantity = quantity; offer.unitPrice = price; offer.material = quantity * price; offer.freight = freight; offer.total = total; offer.expiry = form.get('expiry'); } } save(); closeModal(); db.view = db.mode === 'vendor' ? 'offers' : 'quotes'; render(); toast('New commercial version saved', 'The prior terms remain read-only in the timeline.'); });
    }
    function acceptQuote(id) {
      const quote = quoteFor(id); const offer = db.offers.find(item => item.quote === id); if (!quote || !offer) return;
      if (quote.status === 'EXPIRED') { toast('Offer is read-only', 'Duplicate the expired offer into a new request before accepting.', 'error'); return; }
      if (offer.available < quote.quantity) { toast('Verification required', 'This offer needs verification. We will confirm the available quantity before you pay.', 'error'); return; }
      const inventory = db.inventory.find(item => item.vendor === offer.vendor && item.product === offer.product) || db.inventory.find(item => item.vendor === offer.vendor);
      if (inventory) { inventory.reserved += quote.quantity; inventory.available = inventory.onHand - inventory.reserved; inventory.updated = 'Just now'; }
      offer.reserved += quote.quantity; offer.available -= quote.quantity; quote.status = 'ACCEPTED';
      const orderId = `NEEV-DEMO-${1043 + db.orders.length}`;
      db.orders.unshift({ id: orderId, vendor: offer.vendor, status: 'CONFIRMED', total: quote.total, quantity: quote.quantity, eta: offer.eta, site: db.need.site, vehicle: 'Pending vendor dispatch', driver: 'Dispatch reference only', updated: 'Just now', events: [{ status: 'CONFIRMED', time: 'Just now', actor: 'You', reason: `Accepted ${quote.id}; reservation RES-${8842 + db.orders.length} created.` }, { status: 'RESERVED', time: 'Just now', actor: 'Neev system', reason: `${number(quote.quantity)} units held transactionally; available quantity updated.` }] });
      db.need.status = 'FULFIL'; db.activity.unshift({ kind: 'green', icon: 'shield', title: `Reservation created for ${offer.vendor}`, detail: `${number(quote.quantity)} units held against ${orderId}.`, time: 'Just now' });
      db.view = 'orders'; db.activeOrderId = orderId; save(); render(); toast('Offer accepted and stock reserved', `${orderId} is now visible in the shared order timeline.`);
    }
    function markDelivered() {
      const order = currentOrder(); if (!order) return; order.status = 'DELIVERED'; order.updated = 'Just now'; order.eta = 'Received just now'; order.events.unshift({ status: 'DELIVERED', time: 'Just now', actor: 'You', reason: 'Received quantity confirmed; proof-of-delivery step recorded in demo.' }); save(); render(); toast('Delivery recorded', 'The order is now delivered. Proof remains part of the shared timeline.');
    }
    function openDispute() {
      const order = currentOrder(); if (!order) return; order.status = 'DISPUTED'; order.updated = 'Just now'; order.events.unshift({ status: 'DISPUTED', time: 'Just now', actor: 'You', reason: 'Quality review opened; settlement remains in manual review.' }); db.admin.disputes.unshift({ id: `NEEV-DEMO-D-${30 + db.admin.disputes.length}`, order: order.id, title: 'Buyer opened quality review', owner: 'Isha / Operations', age: 'just now', status: 'OPEN' }); db.activity.unshift({ kind: 'amber', icon: 'alert', title: `Quality review opened for ${order.id}`, detail: 'Keep the material and upload evidence for operations review.', time: 'Just now' }); save(); render(); toast('Case opened', 'Your case is open. Keep the material and upload evidence for review.');
    }
    function verifyVendor(id) {
      const vendor = vendorFor(id); if (!vendor) return; vendor.verified = true; vendor.inventoryFresh = Math.max(vendor.inventoryFresh, 75); db.admin.verifications = db.admin.verifications.filter(item => item.id !== id); db.admin.audit.unshift({ action: 'Vendor verified', actor: 'ops@neev.demo', ref: id, time: 'Just now' }); save(); render(); toast('Vendor verified', `${vendor.name} can now appear as verified supply in the launch zone.`);
    }
    function resolveDispute(id) { const item = db.admin.disputes.find(dispute => dispute.id === id); if (!item) return; item.status = 'RESOLVED'; db.admin.audit.unshift({ action: 'Dispute resolved', actor: 'ops@neev.demo', ref: item.order, time: 'Just now' }); db.admin.disputes = db.admin.disputes.filter(dispute => dispute.id !== id); save(); render(); toast('Exception resolved', `${item.order} remains in the audit trail with its original evidence.`); }
    function openInventoryModal(id) {
      const item = db.inventory.find(record => record.id === id) || db.inventory.find(record => record.vendor === 'Shakti Kiln Works') || db.inventory[0];
      openModal(`${modalHead('Inventory snapshot', 'Update available quantity', 'On-hand cannot fall below active reservations. This demo writes the update to the local mock store.')}<form id="inventory-form"><div class="modal-body"><div class="vendor-line" style="margin-bottom:17px">${vendorAvatar(item.vendor)}<div class="vendor-name">${item.vendor}<small>${item.sku} · ${item.product}</small></div>${statusPill(item.status)}</div><div class="form-grid"><div class="form-field"><label for="inventory-onhand">On-hand quantity</label><input id="inventory-onhand" name="onHand" type="number" min="${item.reserved}" value="${item.onHand}" required /></div><div class="form-field"><label for="inventory-source">Source</label><select id="inventory-source" name="source"><option>Vendor sync</option><option>Manual update</option><option>Operations correction</option></select></div><div class="form-field full"><label>Reserved quantity is protected</label><div class="metric-grid"><div class="metric"><span>Reserved</span><strong>${number(item.reserved)}</strong></div><div class="metric"><span>Current available</span><strong>${number(item.available)}</strong></div><div class="metric"><span>Freshness</span><strong>${item.updated}</strong></div></div></div></div></div><div class="modal-foot"><button type="button" class="btn" data-close-modal>Cancel</button><button type="submit" class="btn primary">Save inventory ${icon('check')}</button></div></form>`);
      document.getElementById('inventory-form').addEventListener('submit', event => { event.preventDefault(); const form = new FormData(event.target); const onHand = Number(form.get('onHand')); if (onHand < item.reserved) { toast('Update blocked', 'On-hand quantity cannot fall below active reservations.', 'error'); return; } item.onHand = onHand; item.available = onHand - item.reserved; item.updated = 'Just now'; item.source = form.get('source'); item.confidence = 'High'; item.status = item.available > 0 ? 'AVAILABLE' : 'PAUSED'; save(); closeModal(); render(); toast('Inventory updated', `${item.sku} now shows ${number(item.available)} available units.`); });
    }
    function openFreightModal() {
      openModal(`${modalHead('Explainable pricing', 'Freight model', 'A range is shown when route confidence is not high. The estimate is not a legal delivery guarantee.')}<div class="modal-body"><div class="metric-grid"><div class="metric"><span>Origin zone</span><strong>Dadri</strong></div><div class="metric"><span>Buyer site</span><strong>Sector 18</strong></div><div class="metric"><span>Distance band</span><strong>10-25 km</strong></div></div><div class="activity-list" style="margin-top:17px"><div class="activity-item"><div class="activity-icon">${icon('package')}</div><div class="activity-copy"><strong>Load and vehicle class</strong><span>25,000 units · approx. 14T multi-axle · return-trip probability included</span></div></div><div class="activity-item"><div class="activity-icon">${icon('map')}</div><div class="activity-copy"><strong>Route quality factor</strong><span>Configured zone rate plus seasonal fuel surcharge.</span></div></div><div class="activity-item"><div class="activity-icon amber">${icon('alert')}</div><div class="activity-copy"><strong>Manual review threshold</strong><span>Routes above 40 km require operations confirmation before reservation.</span></div></div></div><div class="notice" style="margin-top:17px">${icon('info')}<div><strong>Current estimate: Rs 5,400-6,200</strong>Last calculated now · model v1.4 · confidence 82%.</div></div></div><div class="modal-foot"><button class="btn primary" data-close-modal>Close</button></div>`);
    }
    function openSiteModal() {
      openModal(`${modalHead('Saved delivery context', 'Add project site', 'A saved pin can be reused when creating a future material need.')}<form id="site-form"><div class="modal-body"><div class="form-grid"><div class="form-field full"><label for="site-name">Project name</label><input id="site-name" required placeholder="e.g. East Avenue site" /></div><div class="form-field"><label for="site-address">Address / zone</label><input id="site-address" required placeholder="Sector 18, Noida" /></div><div class="form-field"><label for="site-pin-input">Site pin</label><input id="site-pin-input" required placeholder="28.567, 77.326" /></div></div></div><div class="modal-foot"><button type="button" class="btn" data-close-modal>Cancel</button><button type="submit" class="btn primary">Save site ${icon('check')}</button></div></form>`);
      document.getElementById('site-form').addEventListener('submit', event => { event.preventDefault(); const name = document.getElementById('site-name').value; const address = document.getElementById('site-address').value; const pin = document.getElementById('site-pin-input').value; db.sites.push({ name, address, pin, activeNeed: 'No active need', next: 'Saved site' }); save(); closeModal(); render(); toast('Project site saved', 'You can reuse this delivery context for a new material need.'); });
    }
    function openNotifications() {
      openModal(`${modalHead('Inbox', 'Notifications', 'In-app events for quotes, reservations, dispatch, delay, disputes, and verification.')}<div class="modal-body"><div class="activity-list">${db.activity.slice(0, 5).map(item => `<div class="activity-item"><div class="activity-icon ${item.kind}">${icon(item.icon)}</div><div class="activity-copy"><strong>${item.title}</strong><span>${item.detail}</span></div><div class="activity-time">${item.time}</div></div>`).join('')}</div></div><div class="modal-foot"><button class="btn primary" data-close-modal>Mark reviewed</button></div>`);
      db.notifications = 0; save();
    }
    function toast(title, message, tone = 'success') {
      const region = document.getElementById('toast-region'); const toastId = `toast-${Date.now()}`;
      region.innerHTML = `<div class="toast" id="${toastId}"><div class="toast-icon" style="${tone === 'error' ? 'background:var(--red-2);color:var(--red)' : ''}">${icon(tone === 'error' ? 'alert' : 'check')}</div><div><strong>${title}</strong><span>${message}</span></div></div>`;
      setTimeout(() => document.getElementById(toastId)?.remove(), 4200);
    }
    window.addEventListener('resize', () => document.getElementById('mobile-menu')?.classList.toggle('hidden', window.innerWidth > 760));
    window.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    render();
  </script>
</body>
</html>
